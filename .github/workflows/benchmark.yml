name: Crossbyte JVM isolation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: krdlab/setup-haxe@18e4b483cfffca2fb8881530bf8a6cec39dac8fb
        with:
          haxe-version: '4.3.7'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned Java and source dependencies
        run: |
          haxelib install haxe-concurrent 5.1.5 --always --quiet
          haxelib install uuid 2.4.1 --always --quiet
          haxelib install crypto 1.3.0 --always --quiet
          haxelib install hxjava 4.2.0 --always --quiet
          python -m bench fetch --names hxwell,hxwell-crossbyte,crossbyte,emitter,wrk
          make -C dependencies/wrk -j2 WITH_OPENSSL=/usr VER=4.2.0
      - name: Build the same driver with error logging enabled
        run: python -m bench build --case jvm-crossbyte
      - name: Build bare Crossbyte and run controlled comparisons
        run: python tests/diagnosis/run.py
      - name: Preserve diagnosis evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jvm-crossbyte-diagnosis
          path: out/diagnosis/
          retention-days: 14
