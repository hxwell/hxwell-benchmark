name: Target and driver benchmarks

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/benchmarks/**
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Measurement budget (smoke validates the harness only)
        type: choice
        options: [ci, full, stress, smoke]
        default: ci
      cases:
        description: "Comma-separated case IDs, or all"
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build strict HTTP 200 load generator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libssl-dev unzip
          python -m bench fetch --names wrk
          python -m bench build-wrk
      - name: Test benchmark accounting and cleanup
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          HXWELL_TEST_WRK: ${{ github.workspace }}/out/wrk/wrk
        run: |
          python -m pip install -r requirements-charts.txt
          python -m unittest discover -s tests -v
      - name: Select supported cases
        id: matrix
        env:
          BENCH_CASES: ${{ inputs.cases || 'all' }}
        run: python -m bench matrix --cases "$BENCH_CASES" --github-output "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: Build ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: krdlab/setup-haxe@18e4b483cfffca2fb8881530bf8a6cec39dac8fb # v2
        with:
          haxe-version: ${{ matrix.haxe_version || '4.3.7' }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.target == 'jvm'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.target == 'js'
        with:
          node-version: '22.13.0'
      - name: Install pinned Haxelib dependencies
        env:
          TARGET: ${{ matrix.target }}
          HAXE_VERSION: ${{ matrix.haxe_version || '4.3.7' }}
        run: |
          haxelib install haxe-concurrent 5.1.5 --always --quiet
          haxelib install uuid 2.4.1 --always --quiet
          haxelib install crypto 1.3.0 --always --quiet
          if [ "$HAXE_VERSION" = "5.0.0-preview.1" ]; then haxelib install hx4compat 1.0.0 --always --quiet; fi
          case "$TARGET" in
            jvm) haxelib install hxjava 4.2.0 --always --quiet ;;
            js) haxelib install hxnodejs 12.2.0 --always --quiet ;;
          esac
      - name: Install native build tools
        if: matrix.target == 'cpp'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake
      - name: Fetch immutable source and verified jar dependencies
        env:
          DRIVER: ${{ matrix.driver }}
          TARGET: ${{ matrix.target }}
          POLL_BACKEND: ${{ matrix.poll_backend || 'default' }}
          CROSSBYTE_VARIANT: ${{ matrix.crossbyte_variant || 'upstream' }}
        run: |
          CROSSBYTE_SOURCE=crossbyte
          if [ "$CROSSBYTE_VARIANT" = jvm-virtual ]; then CROSSBYTE_SOURCE=crossbyte-jvm-virtual; fi
          case "$DRIVER" in
            crossbyte) NAMES="hxwell,hxwell-crossbyte,$CROSSBYTE_SOURCE,emitter" ;;
            undertow) NAMES=hxwell,maven ;;
            *) NAMES=hxwell ;;
          esac
          if [ "$TARGET" = cpp ]; then NAMES="$NAMES,libhxcpp"; fi
          if [ "$POLL_BACKEND" = libuv ]; then NAMES="$NAMES,crossbyte-libuv,libuv"; fi
          python -m bench fetch --names "$NAMES"
      - name: Verify driver features on virtual I/O or Haxe 5
        if: matrix.crossbyte_variant == 'jvm-virtual' || matrix.haxe_version == '5.0.0-preview.1'
        env:
          CROSSBYTE_VARIANT: ${{ matrix.crossbyte_variant || 'upstream' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsqlite3-0 openssl
          haxelib install utest 1.13.2 --always --quiet
          python - <<'PYDRIVER'
          from pathlib import Path
          import os, shlex, shutil
          from bench.config import load_config
          from bench.dependencies import fetch_repository
          _, lock = load_config()
          work = Path('out/driver-verification').resolve()
          work.mkdir(parents=True, exist_ok=True)
          fetch_repository(work / 'source', lock['repositories']['hxwell-crossbyte'])
          compiler = shutil.which('haxe')
          if compiler is None:
              raise RuntimeError('Haxe compiler is missing')
          wrapper = work / 'haxe-virtual'
          flags = ' -D crossbyte_jvm_virtual_threads' if os.environ['CROSSBYTE_VARIANT'] == 'jvm-virtual' else ''
          wrapper.write_text('#!/bin/sh\nexec ' + shlex.quote(compiler) + flags + ' "$@"\n')
          wrapper.chmod(0o755)
          PYDRIVER
          python -m pip install -r out/driver-verification/source/tests/requirements.txt
          CROSSBYTE_SOURCE=crossbyte
          if [ "$CROSSBYTE_VARIANT" = jvm-virtual ]; then CROSSBYTE_SOURCE=crossbyte-jvm-virtual; fi
          python out/driver-verification/source/tests/run.py --target jvm \
            --hxwell dependencies/hxwell --crossbyte "dependencies/$CROSSBYTE_SOURCE" \
            --emitter dependencies/emitter --haxe "$GITHUB_WORKSPACE/out/driver-verification/haxe-virtual"
          python out/driver-verification/source/tests/core.py --target jvm \
            --hxwell dependencies/hxwell --crossbyte "dependencies/$CROSSBYTE_SOURCE" \
            --emitter dependencies/emitter --haxe "$GITHUB_WORKSPACE/out/driver-verification/haxe-virtual"
      - name: Preserve virtual-driver compatibility reports
        if: always() && (matrix.crossbyte_variant == 'jvm-virtual' || matrix.haxe_version == '5.0.0-preview.1')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: driver-compatibility-${{ matrix.id }}
          retention-days: 14
          path: |
            out/driver-verification/source/out/*.json
            out/driver-verification/source/out/**/build.log
            out/driver-verification/source/out/**/server.log
            out/driver-verification/source/out/**/test.log
      - name: Build release application
        env:
          BENCH_CASE: ${{ matrix.id }}
        run: python -m bench build --case "$BENCH_CASE"
      - name: Preserve binary modes in a tar artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-${{ matrix.id }}
          path: out/build/${{ matrix.id }}.tar.gz
          retention-days: 14
      - name: Preserve build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-errors-${{ matrix.id }}
          path: |
            out/build/**/build.log
            out/build/**/npm.log
            out/build/**/command.json

  benchmark:
    name: Measure all selected cases on one host
    needs: [plan, build]
    if: always() && !cancelled() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
      - name: Install runtimes and wrk build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libssl-dev unzip
          python -m bench fetch --names wrk
          python -m bench build-wrk
          python -m pip install -r requirements-charts.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        # Missing bundles are reported as invalid cases by the runner below.
        continue-on-error: true
        with:
          pattern: application-*
          merge-multiple: true
          path: out/archives
      - name: Unpack executable bundles
        run: python -m bench unpack --archives out/archives --out out/apps
      - name: Warm up and measure sequentially
        id: measure
        env:
          BENCH_CASES: ${{ inputs.cases || 'all' }}
          BENCH_PROFILE: ${{ inputs.profile || (github.event_name == 'pull_request' && 'smoke') || 'ci' }}
        run: >-
          python -m bench run --cases "$BENCH_CASES" --profile "$BENCH_PROFILE"
          --bundles out/apps --wrk "$GITHUB_WORKSPACE/out/wrk/wrk"
          --out out/results
      - name: Generate charts for this attempt
        if: always() && !cancelled()
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          BENCH_CASES: ${{ inputs.cases || 'all' }}
          BENCH_PROFILE: ${{ inputs.profile || (github.event_name == 'pull_request' && 'smoke') || 'ci' }}
          BENCH_OUTCOME: ${{ steps.measure.outcome }}
        run: >-
          python -m bench.charts --report out/results/results.json --output out/results/charts
          --profile "$BENCH_PROFILE" --cases "$BENCH_CASES" --outcome "$BENCH_OUTCOME"
      - name: Publish job summary
        if: always()
        run: |
          if [ -f out/results/summary.md ]; then
            cat out/results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve all results, invalid trials and raw logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          retention-days: 30
          path: out/results/

  publish:
    name: Update README charts
    needs: [plan, benchmark]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.plan.result == 'success' && needs.benchmark.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    concurrency:
      group: benchmark-readme-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-charts.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        # Missing reports publish an explicit unavailable/failed dashboard.
        continue-on-error: true
        with:
          name: benchmark-results
          path: out/readme-input
      - name: Regenerate and publish the managed README section
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          BENCH_CASES: ${{ inputs.cases || 'all' }}
          BENCH_PROFILE: ${{ inputs.profile || 'ci' }}
          BENCH_OUTCOME: ${{ needs.benchmark.result }}
        run: >-
          python -m bench.publish --report out/readme-input/results.json --output out/readme-charts
          --profile "$BENCH_PROFILE" --cases "$BENCH_CASES" --outcome "$BENCH_OUTCOME"
